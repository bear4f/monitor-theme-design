name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的标签，如 v2.7.2：在所选分支的最新提交上新建这个标签并发布；留空只构建不发布"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      # The archive is an installable theme directory rather than a source
      # snapshot: dist/ beside theme.json is the layout a hub reads from
      # <themes>/<short>/, and theme.tar.gz is the one asset name its update button
      # fetches. preview.png sits beside theme.json because it is the panel's
      # thumbnail rather than content the theme serves.
      - run: tar czf theme.tar.gz dist theme.json preview.png
      - run: sha256sum theme.tar.gz | cut -d' ' -f1 | tee theme.tar.gz.sha256

      # A manual dispatch without a tag builds and packages without publishing, so
      # the path can be exercised without cutting a release. gh ships on the
      # runner, keeping a third-party action out of the contents:write step.
      - if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" theme.tar.gz theme.tar.gz.sha256 --generate-notes --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

      # A manual dispatch with a tag publishes from a branch: gh creates the tag on
      # the commit just built. A tag that does not match theme.json is refused, so
      # a release never carries an archive that names another version.
      - if: github.event_name == 'workflow_dispatch' && inputs.tag != '' && !startsWith(github.ref, 'refs/tags/')
        run: |
          [ "$TAG" = "v$(jq -r .version theme.json)" ] || { echo "::error::标签 $TAG 与 theme.json 的版本 $(jq -r .version theme.json) 不符"; exit 1; }
          gh release create "$TAG" theme.tar.gz theme.tar.gz.sha256 --target "$GITHUB_SHA" --generate-notes --repo "$GITHUB_REPOSITORY"
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
